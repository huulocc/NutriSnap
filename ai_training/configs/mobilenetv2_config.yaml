project:
  name: NutriSnapFoodClassifier
  seed: 42

dataset:
  raw_dir: ai_training/data/raw
  source_dir: ai_training/data/source
  downloads_dir: ai_training/data/downloads
  processed_dir: ai_training/data/processed
  image_extensions:
    - .jpg
    - .jpeg
    - .png
    - .webp
  classes:
    - pho
    - banh_mi
    - com_tam
    - bun_bo_hue
    - goi_cuon
    - banh_xeo
    - mi_quang
    - xoi_xeo
    - chao_long
    - bun_thit_nuong
    - bun_rieu
    - hu_tieu
    - banh_cuon
    - banh_trang_nuong
    - cao_lau
  train_ratio: 0.8
  validation_ratio: 0.1
  test_ratio: 0.1
  split_protocol: deduplicated_stratified_80_10_10_v1
  use_class_weights: true
  min_image_size: 64
  minimum_images_per_class: 30
  warning_images_per_class: 200

model:
  architecture: MobileNetV2
  input_height: 224
  input_width: 224
  input_channels: 3
  imagenet_weights: true
  dropout: 0.3
  num_classes: 15
  fine_tune_at: 100

training:
  batch_size: 32
  initial_epochs: 15
  fine_tune_epochs: 15
  initial_learning_rate: 0.001
  fine_tune_learning_rate: 0.00001
  label_smoothing: 0.1
  early_stopping_patience: 5
  reduce_lr_patience: 2
  minimum_learning_rate: 0.000001
  mixed_precision: true
  monitor: val_loss
  restore_best_weights: true
  fine_tune_last_layers: 50
  freeze_batch_normalization: true
  gradient_clipnorm: 1.0
  cache_dataset: false

smoke_test:
  train_batches: 3
  validation_batches: 2
  epochs: 1

augmentation:
  random_flip: horizontal
  random_rotation: 0.08
  random_zoom: 0.15
  random_translation_height: 0.1
  random_translation_width: 0.1
  random_contrast: 0.15

output:
  checkpoint_dir: ai_training/outputs/checkpoints
  report_dir: ai_training/outputs/reports
  plot_dir: ai_training/outputs/plots
  tflite_dir: ai_training/outputs/tflite
  run_dir: ai_training/outputs/runs
